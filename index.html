<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evolve HQ</title>
<style>
:root{font-family:system-ui,sans-serif;color:#22271e;background:#f4f5ee;color-scheme:light}
*{box-sizing:border-box}
body{margin:0}
header{padding:28px max(24px,calc((100vw - 1240px)/2));background:#1c251d;color:#f4f5ec;display:flex;align-items:center;justify-content:space-between;gap:20px}
h1{font-size:clamp(1.7rem,4vw,2.35rem);margin:0;letter-spacing:-.05em}
header a{color:#d6e6b0;text-underline-offset:4px}
main{width:min(1240px,100% - 48px);margin:36px auto 64px}
.overview{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;margin-bottom:38px}
.panel,article{background:#fff;border:1px solid #dce0d4;border-radius:16px;padding:22px}
.panel h2,h2,h3{margin:0;letter-spacing:-.03em}
h2{font-size:1.35rem}
h3{font-size:1.12rem}
p{line-height:1.5;margin:8px 0 13px}
.muted,small{color:#56604f}
.roster{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.roster li{padding:5px 9px;background:#eff1e8;border-radius:6px;font-size:.86rem}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}
select{background:#fff;color:#22271e;border:1px solid #bdc5b7;border-radius:8px;padding:8px;font:inherit;max-width:100%}
#actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(255px,100%),1fr));gap:12px}
article{display:flex;flex-direction:column;align-items:flex-start;gap:7px}
article p{margin:0 0 4px}
article button{margin-top:auto}
button{background:#2d4a34;color:#fff;border:0;border-radius:8px;padding:9px 12px;font:inherit;font-size:.88rem;cursor:pointer}
button:hover{background:#3a6044}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #708d5a;outline-offset:3px}
details{margin-top:32px;padding:16px 0;border-top:1px solid #dce0d4}
summary{cursor:pointer;font-weight:650}
#skills section{display:inline-block;vertical-align:top;width:min(100%,280px);margin:12px 8px 0 0}
#skills ul{padding-left:20px;margin-top:8px}
#copy-status{min-height:1.2em;color:#304d32;font-size:.88rem}
@media(max-width:650px){.overview{grid-template-columns:1fr}.controls{flex-wrap:wrap}main{width:calc(100% - 32px);margin-top:22px}header{padding:18px 16px}}
</style>
</head>
<body>
<!-- HQ_HEADER_START --><header><h1>Evolve HQ</h1><a href="team/roster.md">Team roster</a></header><!-- HQ_HEADER_END -->
<main>
<div class="overview">
<section class="panel">
<h2>Start a research sprint</h2>
<p class="muted">Send Codex a product, market, and decision. The Chief of Staff routes the work through research, evidence review, and angle development.</p>
<button type="button" id="sprint">Copy sprint request</button>
<p id="copy-status" aria-live="polite"></p>
</section>
<section class="panel">
<h2>Starter team</h2>
<ul class="roster" id="roster"></ul>
</section>
</div>
<div class="controls"><h2>Workflow actions</h2><label>Desk <select id="desk"><option value="">All desks</option></select></label></div>
<div id="actions"></div>
<details><summary>Browse plugin skills by desk</summary><div id="skills"></div></details>
</main>
<script type="application/json" id="catalog">{"sharedSkills": ["free-ecommerce-workflows"], "desks": [{"name": "Chief of Staff", "skills": ["evolve-hq", "evolve-skill", "evolve-intake", "evolve-roadmap", "launch"]}, {"name": "Research & Evidence", "skills": ["market-research-team", "market-research", "evolve-research", "evolve-customer-market", "evolve-account-research", "evolve-competitor-creative", "evolve-insights", "customer-research", "competitor-profiling", "competitors", "manual-voc-research", "anthony-camacho-research", "last30days"]}, {"name": "Strategy & Copy", "skills": ["evolve-angles", "evolve-positioning", "evolve-briefs", "evolve-copywriting", "evolve-copy-review", "evolve-storytelling", "copywriting", "cold-traffic-ad-craft", "native-ads-research-to-creative", "write-video-ad-scripts", "humanizer", "offers", "pricing"]}, {"name": "Creative Studio", "skills": ["evolve-create", "evolve-iteration", "evolve-ugc", "evolve-partnership-ads", "adapt-reference-ad", "build-static-ads-in-figma", "metaphor-ads"]}, {"name": "Video Editing", "skills": ["evolve-production"]}, {"name": "Performance & Testing", "skills": ["evolve-media-buying", "evolve-creative-analysis", "evolve-test-design", "analyze-ads", "ads", "analytics", "attribution", "ab-testing"]}, {"name": "Storefront & Lifecycle", "skills": ["store-content-cro-review", "build-advertorials", "write-product-page-copy", "cro", "emails", "max-ecommerce-email", "churn-prevention", "post-purchase-funnels"]}, {"name": "Organic Growth", "skills": ["ai-seo", "aso", "co-marketing", "community-marketing", "content-strategy"]}, {"name": "Office Development", "skills": ["vibe-coding-toolkit"]}], "actions": [{"id": "reviews", "desk": "Research & Evidence", "title": "Analyze customer reviews", "purpose": "Source-linked voice of customer themes, objections, and testable angles.", "inputs": ["research.csv", "research.json"], "output": "research.md", "owner": "Customer Researcher"}, {"id": "concepts", "desk": "Creative Studio", "title": "Develop ad concepts", "purpose": "Ad concepts, UGC script, shoot plan, static direction, and QA.", "inputs": ["creative.json"], "output": "creative.md", "owner": "Creative Producer"}, {"id": "vsl", "desk": "Creative Studio", "title": "Write a video sales letter", "purpose": "Timed script with voiceover and a visual plan.", "inputs": ["vsl.json"], "output": "vsl.md", "owner": "Creative Producer"}, {"id": "animation", "desk": "Creative Studio", "title": "Plan an animation", "purpose": "Scene prompts with character and product continuity.", "inputs": ["animation.json"], "output": "animation.md", "owner": "Creative Producer"}, {"id": "cinematic", "desk": "Creative Studio", "title": "Plan a cinematic shoot", "purpose": "Shot list, framing, sound, and continuity checks.", "inputs": ["cinematic.json"], "output": "cinematic.md", "owner": "Creative Producer"}, {"id": "storyboard", "desk": "Video Editing", "title": "Render a storyboard preview", "purpose": "Vertical MP4 preview using captions and supplied images.", "inputs": ["storyboard.json"], "output": "storyboard.mp4", "owner": "Video Editor"}, {"id": "asset-handoff", "desk": "Video Editing", "title": "Prepare an ad asset handoff", "purpose": "A review CSV with validated paths to local ad assets.", "inputs": ["ad-handoff.json"], "output": "ad-handoff.csv", "owner": "Video Editor"}, {"id": "creator-seeding", "desk": "Creative Studio", "title": "Manage creator seeding", "purpose": "Draft orders and a follow-up queue for creators.", "inputs": ["creator-seeding.csv"], "output": "creator-queue.json", "owner": "Creator Coordinator"}, {"id": "roas", "desk": "Performance & Testing", "title": "Calculate ROAS", "purpose": "Return on ad spend by ad and currency.", "inputs": ["ad-metrics.csv"], "output": "roas.md", "owner": "Performance Analyst"}, {"id": "media", "desk": "Performance & Testing", "title": "Analyze media performance", "purpose": "Analysis with supplied attribution context.", "inputs": ["media.json"], "output": "media.md", "owner": "Performance Analyst"}, {"id": "landing", "desk": "Storefront & Lifecycle", "title": "Draft a landing page", "purpose": "Page copy matched to the approved angle and offer.", "inputs": ["landing.json"], "output": "landing.md", "owner": "Lifecycle Lead"}, {"id": "email", "desk": "Storefront & Lifecycle", "title": "Draft an email sequence", "purpose": "Email copy, triggers, timing, and exit conditions.", "inputs": ["email.json"], "output": "email.md", "owner": "Lifecycle Lead"}, {"id": "support", "desk": "Storefront & Lifecycle", "title": "Draft a support reply", "purpose": "A policy-based reply or escalation draft.", "inputs": ["support.json"], "output": "support.md", "owner": "Support Coordinator"}, {"id": "transcribe", "desk": "Video Editing", "title": "Transcribe footage", "purpose": "Offline transcription with word timestamps.", "inputs": ["footage"], "output": "transcript.json", "owner": "Video Editor"}, {"id": "person-matte", "desk": "Video Editing", "title": "Create a person matte", "purpose": "ProRes 4444 MOV with a person mask in its alpha channel.", "inputs": ["footage"], "output": "person-matte.mov", "owner": "Video Editor"}, {"id": "resolve-handoff", "desk": "Video Editing", "title": "Prepare a Resolve edit", "purpose": "An editing task with the approved script, evidence, and source assets.", "inputs": ["approved script"], "output": "resolve-handoff.md", "owner": "Video Editor"}], "roles": [{"name": "Chief of Staff", "desk": "Chief of Staff", "group": "Starter team", "mandate": "Own intake, select the workflow, assign the sprint, verify the deliverable and bring decisions to the owner."}, {"name": "Customer Researcher", "desk": "Research & Evidence", "group": "Starter team", "mandate": "Record short customer quotes and observations with stable source IDs, context, and dates. Flag gaps and contradictory evidence."}, {"name": "Competitor Researcher", "desk": "Research & Evidence", "group": "Starter team", "mandate": "Compare direct offers and substitutes with market, currency, pack size, terms, and dated sources."}, {"name": "Evidence Reviewer", "desk": "Research & Evidence", "group": "Starter team", "mandate": "Check the cited source against the claims and review material fixes. If the host uses one agent, label the review as a self-review."}, {"name": "Ad Strategist", "desk": "Strategy & Copy", "group": "Starter team", "mandate": "Use reviewed evidence to propose up to three distinct, testable angles and recommend the first test."}, {"name": "Video Editor", "desk": "Video Editing", "group": "Starter team", "mandate": "Take approved scripts and supplied assets through transcripts, mattes, previews, Resolve preparation, and draft asset handoffs."}, {"name": "Office Developer", "desk": "Office Development", "group": "Starter team", "mandate": "Own Evolve HQ code and local workflow integration. Use the technical toolkit and verify changes through the real entry points."}, {"name": "Creative Producer", "desk": "Creative Studio", "group": "Specialist", "mandate": "Translate approved angles and briefs into production-ready concepts, scripts, and shot plans."}, {"name": "Creator Coordinator", "desk": "Creative Studio", "group": "Specialist", "mandate": "Maintain the creator draft-order and follow-up queue for review."}, {"name": "Performance Analyst", "desk": "Performance & Testing", "group": "Specialist", "mandate": "Read supplied exports and attribution context, calculate ROAS and identify the evidence for the next test."}, {"name": "Lifecycle Lead", "desk": "Storefront & Lifecycle", "group": "Specialist", "mandate": "Draft landing pages and email from approved facts, angle, offer, and audience."}, {"name": "Support Coordinator", "desk": "Storefront & Lifecycle", "group": "Specialist", "mandate": "Draft replies or escalations based on the supplied policies, examples, and ticket."}, {"name": "Organic Growth Lead", "desk": "Organic Growth", "group": "Specialist", "mandate": "Use organic growth workflows for requested content, search, community, and partnerships."}]}</script>
<script>
"use strict";
const {desks, actions, roles, sharedSkills} = JSON.parse(document.querySelector("#catalog").textContent);
const select = document.querySelector("#desk");
const cards = document.querySelector("#actions");
const status = document.querySelector("#copy-status");
function make(tag, text, className) {
  const node = document.createElement(tag);
  if (text) node.textContent = text;
  if (className) node.className = className;
  return node;
}
async function copy(text, button) {
  try {
    await navigator.clipboard.writeText(text);
    status.textContent = "Request copied. Paste it into Codex.";
    button.textContent = "Copied";
    window.setTimeout(() => { button.textContent = button.dataset.label; }, 1500);
  } catch {
    window.prompt("Copy this request and paste it into Codex.", text);
  }
}
function button(label, request) {
  const node = make("button", label);
  node.type = "button";
  node.dataset.label = label;
  node.addEventListener("click", () => copy(request, node));
  return node;
}
for (const role of roles.filter(role => role.group === "Starter team")) {
  const item = make("li", role.name);
  item.title = role.mandate;
  document.querySelector("#roster").append(item);
}
for (const desk of desks) {
  const option = make("option", desk.name);
  option.value = desk.name;
  select.append(option);
}
function showActions() {
  cards.replaceChildren();
  for (const action of actions.filter(action => !select.value || action.desk === select.value)) {
    const card = make("article");
    const request = "Use Evolve HQ to run the " + action.title + " action ("
      + action.id + ") for [product] from [input file]. Use the Evolve HQ workspace and keep the result local for review."
      + (action.id === "resolve-handoff" ? " Selected angle: [angle]. Evidence IDs: [IDs]. Source assets: [files]." : "");
    card.append(make("small", action.desk), make("h3", action.title), make("p", action.purpose),
      make("small", action.inputs.join(" / ") + " → " + action.output), button("Copy request", request));
    cards.append(card);
  }
  if (!cards.children.length) cards.append(make("p", "Use the desk’s plugin skills below for this kind of work.", "muted"));
}
for (const desk of [...desks, {name: "Shared execution", skills: sharedSkills}]) {
  const section = make("section");
  const list = make("ul");
  for (const name of desk.skills) list.append(make("li", name));
  section.append(make("h3", desk.name), list);
  document.querySelector("#skills").append(section);
}
const sprint = document.querySelector("#sprint");
sprint.dataset.label = sprint.textContent;
sprint.addEventListener("click", () => copy("Run an Evolve HQ Market Research Team sprint in the Evolve HQ workspace. Product: [name or URL]. Market: [market]. Decision: [what should we decide?]. Supplied sources: [links or files]. Save the brief and source-backed angles in the task folder.", sprint));
select.addEventListener("change", showActions);
showActions();
</script>
</body>
</html>
